      - type: markdown
        title: Tous les prochains passages
        content: |-
          {% set entities = [
            'sensor.tisseo_aeroconstellation_t1',
            'sensor.tisseo_aeroconstellation_30',
            'sensor.tisseo_aeroconstellation_70',
            'sensor.tisseo_aeroconstellation_71',
            'sensor.tisseo_aeroconstellation_130'
          ] %}
          {% set ns = namespace(passages=[]) %}
          {% for entity in entities %}
            {% set ns.passages = ns.passages + (state_attr(entity, 'passages') or []) %}
          {% endfor %}
          {% set passages = ns.passages | sort(attribute='dans_minutes') %}
          {% if passages | count > 0 %}
          | Ligne | Direction | Passage | Information |
          |:---:|:---|---:|:---|
          {% for p in passages[:12] %}| **{{ p.ligne }}** | {{ p.destination }} | **{{ 'maintenant' if p.dans_minutes == 0 else p.dans_minutes ~ ' min' }}** | {{ '🟢 direct' if p.temps_reel else '🟠 prévu' }} |
          {% endfor %}
          {% else %}
          **Aucun passage annoncé pour le moment.**
          {% endif %}
