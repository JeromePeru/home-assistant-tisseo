title: Transports
path: transports
icon: mdi:bus-clock
type: panel
cards:
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          # 🚌 Aéroconstellation
          Prochains passages des lignes suivies
      - type: grid
        columns: 3
        square: false
        cards:
          - type: picture-elements
            image: &tisseo_background >-
              data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20640%20360%22%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20rx%3D%2228%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M28%200h584q28%200%2028%2028v132H0V28Q0%200%2028%200%22%20fill%3D%22%230766c7%22%2F%3E%3Ccircle%20cx%3D%2285%22%20cy%3D%2280%22%20r%3D%2250%22%20fill%3D%22%23fff%22%2F%3E%3Ctext%20x%3D%22160%22%20y%3D%2274%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2230%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%3EA%C3%A9roconstellation%3C%2Ftext%3E%3Cline%20x1%3D%2240%22%20y1%3D%22276%22%20x2%3D%22600%22%20y2%3D%22276%22%20stroke%3D%22%23e4e8ee%22%20stroke-width%3D%222%22%2F%3E%3Ccircle%20cx%3D%2254%22%20cy%3D%22312%22%20r%3D%229%22%20fill%3D%22%232ac273%22%2F%3E%3Ctext%20x%3D%2276%22%20y%3D%22320%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2220%22%20fill%3D%22%236b7280%22%3Eprochain%20passage%3C%2Ftext%3E%3C%2Fsvg%3E
            elements:
              - type: image
                image: >-
                  data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2265%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2248%22%20font-weight%3D%22800%22%20fill%3D%22%23075fc7%22%3ET1%3C%2Ftext%3E%3C%2Fsvg%3E
                style: &route_style
                  left: 13.3%
                  top: 22%
                  width: 14%
                  color: '#075fc7'
                  font-size: 17px
                  font-weight: 800
                  text-align: center
              - type: icon
                icon: mdi:tram
                style: &vehicle_style
                  left: 90%
                  top: 20%
                  color: white
                  --mdc-icon-size: 48px
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_t1
                attribute: prochaine_destination
                prefix: 'direction '
                style: &direction_style
                  left: 25%
                  top: 27%
                  transform: none
                  color: white
                  font-size: 19px
                  font-weight: 500
                  max-width: 68%
                  overflow: hidden
                  text-overflow: ellipsis
                  white-space: nowrap
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_t1
                style: &time_style
                  left: 8%
                  top: 53%
                  transform: none
                  color: '#172033'
                  font-size: 54px
                  font-weight: 800
                  letter-spacing: -2px
            tap_action:
              action: more-info
          - type: picture-elements
            image: *tisseo_background
            elements:
              - type: image
                image: >-
                  data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2265%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2248%22%20font-weight%3D%22800%22%20fill%3D%22%23075fc7%22%3E30%3C%2Ftext%3E%3C%2Fsvg%3E
                style: *route_style
              - type: icon
                icon: mdi:bus
                style: *vehicle_style
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_30
                attribute: prochaine_destination
                prefix: 'direction '
                style: *direction_style
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_30
                style: *time_style
            tap_action:
              action: more-info
          - type: picture-elements
            image: *tisseo_background
            elements:
              - type: image
                image: >-
                  data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2265%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2248%22%20font-weight%3D%22800%22%20fill%3D%22%23075fc7%22%3E70%3C%2Ftext%3E%3C%2Fsvg%3E
                style: *route_style
              - type: icon
                icon: mdi:bus
                style: *vehicle_style
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_70
                attribute: prochaine_destination
                prefix: 'direction '
                style: *direction_style
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_70
                style: *time_style
            tap_action:
              action: more-info
          - type: picture-elements
            image: *tisseo_background
            elements:
              - type: image
                image: >-
                  data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2265%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2248%22%20font-weight%3D%22800%22%20fill%3D%22%23075fc7%22%3E71%3C%2Ftext%3E%3C%2Fsvg%3E
                style: *route_style
              - type: icon
                icon: mdi:bus
                style: *vehicle_style
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_71
                attribute: prochaine_destination
                prefix: 'direction '
                style: *direction_style
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_71
                style: *time_style
            tap_action:
              action: more-info
          - type: picture-elements
            image: *tisseo_background
            elements:
              - type: image
                image: >-
                  data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2265%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2242%22%20font-weight%3D%22800%22%20fill%3D%22%23075fc7%22%3E130%3C%2Ftext%3E%3C%2Fsvg%3E
                style: *route_style
              - type: icon
                icon: mdi:bus
                style: *vehicle_style
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_130
                attribute: prochaine_destination
                prefix: 'direction '
                style: *direction_style
              - type: state-label
                entity: sensor.tisseo_aeroconstellation_130
                style: *time_style
            tap_action:
              action: more-info
      - type: markdown
        title: Tous les prochains passages
        content: |-
          {% set entities = [
            'sensor.tisseo_aeroconstellation_t1',
            'sensor.tisseo_aeroconstellation_30',
            'sensor.tisseo_aeroconstellation_70',
            'sensor.tisseo_aeroconstellation_71',
            'sensor.tisseo_aeroconstellation_130'
          ] %}
          {% set ns = namespace(passages=[]) %}
          {% for entity in entities %}
            {% set ns.passages = ns.passages + (state_attr(entity, 'passages') or []) %}
          {% endfor %}
          {% set passages = ns.passages | sort(attribute='dans_minutes') %}
          {% if passages | count > 0 %}
          | Ligne | Direction | Passage | Information |
          |:---:|:---|---:|:---|
          {% for p in passages[:12] %}| **{{ p.ligne }}** | {{ p.destination }} | **{{ 'maintenant' if p.dans_minutes == 0 else p.dans_minutes ~ ' min' }}** | {{ '🟢 direct' if p.temps_reel else '🟠 prévu' }} |
          {% endfor %}
          {% else %}
          **Aucun passage annoncé pour le moment.**
          {% endif %}
